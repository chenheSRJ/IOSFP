# ============================================================================
# 远程打包：push 到 GitHub 后，Actions 自动编译出 OneStep deb，供直接下载。
#
# 方案说明：使用社区标准 Randomblock1/theos-action（安装 Theos + iOS SDK，
# 无需 Mac、无需 Docker 容器镜像）。
#
# 使用方法：
#   1. push 本仓库（或手动运行本工作流）
#   2. 打开仓库 Actions 页查看 "Build OneStep deb"
#   3. 构建产物在 Artifacts：onestep-deb（解压得 com.onestep.ios_*.deb）
# ============================================================================
name: Build OneStep deb

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos (+ iOS SDK)
        uses: Randomblock1/theos-action@v1
        with:
          theos-src: "https://github.com/theos/theos"
          theos-sdks: "https://github.com/theos/sdks"

      - name: Build package
        run: |
          make clean
          make package
          ls -la packages/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: onestep-deb
          path: packages/*.deb
          if-no-files-found: error
